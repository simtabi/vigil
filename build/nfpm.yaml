# nfpm config for deb/rpm packages. ARCH/VERSION/GOARCH are supplied via the
# environment by src/scripts/build-all.sh (nfpm expands ${VAR}), which runs
# from the repository root, so src: is relative to it.
name: vigil
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "Imani Manyara <imani@simtabi.com>"
description: |
  Keep Microsoft Teams active on a configurable schedule.
vendor: Simtabi LLC
homepage: https://opensource.simtabi.com/products/vigil
license: MIT
contents:
  - src: ./build/linux/vigil_linux_${GOARCH}
    dst: /usr/bin/vigil
