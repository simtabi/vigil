name: Build binaries

# Reusable matrix build — the single source of truth for compiling/bundling.
# Targets come from build/targets.txt and the build logic from scripts/build-all.sh,
# so local `make dist` and CI stay identical. Linux/Windows/BSD cross-compile
# CGO-free on one Linux runner; macOS needs cgo on native runners.
on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into binaries and archives.
        required: true
        type: string
      artifact-prefix:
        description: Prefix for the uploaded artifact names (<prefix>-cross, <prefix>-darwin).
        required: false
        type: string
        default: dist

permissions:
  contents: read

jobs:
  cross:
    name: linux / windows / bsd (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: install nfpm
        # nfpm@latest can require a newer patch release than go.mod pins
        # (v2.47.0 needs go >= 1.26.4), and setup-go sets GOTOOLCHAIN=local, so
        # let go fetch the toolchain the tool asks for.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: build + bundle
        run: VIGIL_SCOPE=cross VIGIL_PACKAGES=1 VIGIL_CHECKSUMS=0 ./scripts/build-all.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-cross
          if-no-files-found: error
          path: dist/archives/*
          retention-days: 14

  mac:
    name: macos apple-silicon + intel + universal (cgo)
    # One Apple-Silicon runner builds arm64 natively and cross-builds amd64 via
    # clang, then lipo-merges a universal binary — no separate Intel runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build + bundle (arm64 + amd64 + universal)
        run: VIGIL_SCOPE=darwin VIGIL_CHECKSUMS=0 ./scripts/build-all.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-darwin
          if-no-files-found: error
          path: dist/archives/*
          retention-days: 14
