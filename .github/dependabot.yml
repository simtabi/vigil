version: 2
updates:
  # The Go module lives in src/ (github.com/simtabi/vigil/src).
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      gomod-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /src/tools/iconz
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      gomod-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
