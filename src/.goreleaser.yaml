version: 2
project_name: vigil

# Run from the repository root: goreleaser ... --config src/.goreleaser.yaml.
# The module lives in src/ (builds[].dir), and archive files (LICENSE, README,
# CHANGELOG) are read from the root, which a config run from inside src/ cannot
# reach.
#
# GoReleaser writes into a scratch dist, .cache/goreleaser/ (gitignored), never
# into build/. build/ holds one folder per OS and nothing else; `make cross` and
# `make dist` write it with src/scripts/build-all.sh. A release (simtabi/.github's
# go-release.yml) uploads straight from this dist, so release assets stay flat.
dist: .cache/goreleaser

before:
  hooks:
    - go -C src mod tidy

# One binary cross-compiled to the full OS/arch matrix (matching build/targets.txt
# and src/scripts/build-all.sh). Every non-darwin target is a static, CGO-free binary
# (CGO_ENABLED=0). darwin is the exception: the input engine
# (src/internal/activity/input_darwin.go) links CoreGraphics/IOKit via cgo, so the two
# darwin targets build with CGO_ENABLED=1 — which is why this release runs on a
# macOS runner (see .github/workflows/release.yml). -trimpath makes builds
# reproducible and -s -w strips debug info for smaller artifacts.
builds:
  - id: vigil
    dir: src
    main: ./cmd/vigil
    binary: vigil
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Explicit target list — the single source of truth mirrored from
    # build/targets.txt: 64-bit, 32-bit (386/armv6/armv7), ARM64, riscv64,
    # ppc64le, s390x, the BSDs, and macOS/Windows/Linux.
    targets:
      - linux_amd64
      - linux_386
      - linux_arm64
      - linux_arm_6
      - linux_arm_7
      - linux_riscv64
      - linux_ppc64le
      - linux_s390x
      - windows_amd64
      - windows_386
      - windows_arm64
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - freebsd_386
      - freebsd_arm64
      - openbsd_amd64
      - openbsd_arm64
      - netbsd_amd64
    # darwin needs cgo + the macOS SDK (Apple frameworks). On the arm64 macOS
    # runner, arm64 builds natively and amd64 cross-builds via clang's -arch.
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang -arch x86_64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/simtabi/vigil/src/internal/cli.version={{ .Version }}
      - -X github.com/simtabi/vigil/src/internal/cli.commit={{ .Commit }}
      - -X github.com/simtabi/vigil/src/internal/cli.date={{ .CommitDate }}

# A single macOS universal binary (amd64 + arm64) alongside the per-arch ones.
universal_binaries:
  - id: vigil
    ids: [vigil]
    name_template: vigil
    replace: false

# All artifacts use one flat, versionless, Go-style naming scheme:
#   vigil_<os>_<arch>[.ext]  with darwin → macos, e.g.
#   vigil_macos_arm64, vigil_linux_amd64, vigil_windows_386.exe,
#   vigil_macos_universal, vigil_linux_armv7.
# The release tag carries the version. install scripts reconstruct these names.
archives:
  - id: binary
    ids: [vigil]
    formats: [binary]
    name_template: &name >-
      vigil_{{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "all" }}universal{{ else if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}

  - id: archive
    ids: [vigil]
    name_template: *name
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Native Linux packages (nfpm operates on the Linux builds only).
nfpms:
  - id: vigil
    ids: [vigil]
    package_name: vigil
    vendor: Simtabi LLC
    homepage: "https://opensource.simtabi.com/products/vigil"
    maintainer: "Imani Manyara <imani@simtabi.com>"
    description: "Keep Microsoft Teams active on a configurable schedule."
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    file_name_template: 'vigil_linux_{{ if eq .Arch "arm" }}armv{{ .Arm }}{{ else }}{{ .Arch }}{{ end }}'

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Reproducible source tarball, uploaded as a first-class release asset next to
# GitHub's auto-generated "Source code" links, so every release ships the exact
# code as well as the binaries.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# One SBOM per archive (syft, SPDX-JSON), attached as release assets so
# consumers can audit the supply chain of what they download.
sboms:
  - id: archive
    artifacts: archive

# The GitHub release is the only channel (owner, 2026-11-13): no homebrew_casks, scoops, winget
# or any other publishing block. vigil has no release on GitHub now and no entry in
# simtabi/homebrew-tap or simtabi/scoop-bucket, so nothing there is left to freeze.
# simtabi/.github's go-release.yml refuses this config if one of those blocks comes back, and
# src/internal/release's TestGoReleaserPublishesNowhereElse fails first.

release:
  github:
    owner: simtabi
    name: vigil
  draft: false
  prerelease: auto

changelog:
  # Do not set disable: true. GoReleaser reads --release-notes inside its
  # changelog pipe, so disabling the pipe drops the notes (ssh-manager v3.2.0
  # and v3.4.0 published empty bodies that way). With --release-notes given,
  # GoReleaser uses that file (the tagged CHANGELOG.md section) and generates
  # nothing itself.
  use: git
